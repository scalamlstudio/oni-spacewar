<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
  <filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="43" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0.08 0 0 0 0  0 0.08 0 0 0  0 0 0.08 0 0  0 0 0 0.35 0" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a4bca9"/>
    <stop offset="0.45" stop-color="#78998c"/>
    <stop offset="1" stop-color="#547b73"/>
  </linearGradient>
  <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#245b5d"/>
    <stop offset="0.5" stop-color="#173f45"/>
    <stop offset="1" stop-color="#102b31"/>
  </linearGradient>
  <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#28484c"/>
    <stop offset="1" stop-color="#0b2025"/>
  </linearGradient>
  <pattern id="floorGrid" width="64" height="64" patternUnits="userSpaceOnUse">
    <path d="M64 0H0V64" fill="none" stroke="#2f605d" stroke-width="2" opacity="0.32"/>
  </pattern>
  <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="16" height="16" fill="transparent"/>
    <path d="M0 0V16" stroke="#f1ba61" stroke-width="4" opacity="0.45"/>
  </pattern>
  
</defs>
<rect x="0" y="0" width="256" height="256" fill="#071013" /><rect x="0" y="0" width="256" height="256" fill="#10282d" filter="url(#paint)"/><path d="M0 0L256 22" fill="none" stroke="#1a373d" stroke-width="3" opacity="0.45"/><path d="M0 64L256 86" fill="none" stroke="#1a373d" stroke-width="3" opacity="0.45"/><path d="M0 128L256 150" fill="none" stroke="#1a373d" stroke-width="3" opacity="0.45"/><path d="M0 192L256 214" fill="none" stroke="#1a373d" stroke-width="3" opacity="0.45"/><path d="M0 0L-20 256" fill="none" stroke="#0b2025" stroke-width="4" opacity="0.45"/><path d="M64 0L44 256" fill="none" stroke="#0b2025" stroke-width="4" opacity="0.45"/><path d="M128 0L108 256" fill="none" stroke="#0b2025" stroke-width="4" opacity="0.45"/><path d="M192 0L172 256" fill="none" stroke="#0b2025" stroke-width="4" opacity="0.45"/><path d="M20 34H236M32 214H224" stroke="#071316" stroke-width="8" opacity="0.5"/><rect x="32" y="34" width="52" height="14" fill="url(#hatch)" opacity="0.22"/>
</svg>