name: content

# Content checks (TAKOAI-80): manifest/processed files match their source,
# cut-outs keep a margin, 8-direction characters share one canvas contract.
# `oni-content` has no Bevy dependency, so this runs in a minute or two and
# also on art-only commits.
on:
  pull_request:
    paths:
      - "assets/**"
      - "crates/content/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/content.yml"
  push:
    branches: [master]
    paths:
      - "assets/**"
      - "crates/content/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/content.yml"
  workflow_dispatch:

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Content tests
        run: cargo test --locked -p oni-content
