[package]
name = "bevy-netcode-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bevy = "=0.19.1"
bevy_ggrs = "=0.22.0"
ggrs = "=0.13.0"
matchbox_socket = "=0.14.0"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", default-features = false, features = ["serde", "alloc"] }
