[workspace]
resolver = "2"
members = ["crates/sim", "crates/content", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Exact pins: only upgrade on an explicit issue.
bevy = "=0.19.1"
bevy_ggrs = "=0.22.0"
ggrs = "=0.13.0"
matchbox_socket = "=0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", default-features = false, features = ["serde", "alloc"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
sim = { path = "crates/sim", package = "oni-sim" }
content = { path = "crates/content", package = "oni-content" }
